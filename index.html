<!DOCTYPE html><html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Надюшка ❤️ Love App</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}body{ min-height:100vh; overflow:hidden; display:flex; justify-content:center; align-items:center; background: radial-gradient(circle at top,#ff9a9e,#fad0c4); }

/* PARALLAX BACKGROUND */ .bg{ position:fixed; inset:-50px; background: radial-gradient(circle,#ffffff33,transparent); transform:translateZ(0); animation:moveBg 10s infinite alternate ease-in-out; }

@keyframes moveBg{ from{transform:scale(1) translateX(-20px)} to{transform:scale(1.2) translateX(20px)} }

.hearts{ position:fixed; inset:0; pointer-events:none; }

.heart{ position:absolute; color:#ff2d55; animation:fall linear forwards; }

@keyframes fall{ from{transform:translateY(-10vh);opacity:1} to{transform:translateY(110vh);opacity:0} }

.app{ width:92%; max-width:420px; text-align:center; z-index:2; }

h1{ color:white; font-size:3rem; text-shadow:0 0 20px #ff2d55; margin-bottom:10px; cursor:pointer; }

.card{ background:rgba(255,255,255,0.2); backdrop-filter:blur(12px); padding:20px; border-radius:20px; color:white; margin-top:15px; box-shadow:0 10px 30px rgba(0,0,0,0.2); transform-style:preserve-3d; }

.btn{ margin:6px; padding:10px 15px; border:none; border-radius:25px; cursor:pointer; background:linear-gradient(45deg,#ff4d6d,#ff758f); color:white; transition:.3s; box-shadow:0 0 10px #ff4d6d; }

.btn:hover{ transform:scale(1.1); box-shadow:0 0 20px #ff2d55; }

.hidden{display:none;}

/* MODAL */ .modal{ position:fixed; inset:0; background:rgba(0,0,0,0.7); display:flex; justify-content:center; align-items:center; }

.modal-content{ background:white; padding:25px; border-radius:20px; text-align:center; animation:pop .4s; }

@keyframes pop{ from{transform:scale(0.5)} to{transform:scale(1)} }

/* EXPLOSION SCREEN */ .explosion{ position:fixed; inset:0; background:black; color:white; display:flex; justify-content:center; align-items:center; flex-direction:column; font-size:2rem; animation:fadeIn 1s; }

@keyframes fadeIn{ from{opacity:0} to{opacity:1} }

.typing{ overflow:hidden; white-space:nowrap; border-right:2px solid white; animation:typing 3s steps(30,end),blink .7s infinite; }

@keyframes typing{ from{width:0} to{width:100%} }

@keyframes blink{ 50%{border-color:transparent} } </style>

</head>
<body><div class="bg"></div>
<div class="hearts" id="hearts"></div><div class="app"><h1 id="title" onclick="secretClick()">Надюшка 💖</h1><div id="home" class="card">
  <p class="typing">Цей світ створений тільки для тебе...</p>
  <button class="btn" onclick="show('memories')">Спогади</button>
  <button class="btn" onclick="show('messages')">Повідомлення</button>
  <button class="btn" onclick="show('surprise')">Сюрприз</button>
</div><div id="memories" class="card hidden">
  <h3>💞 Спогади</h3>
  <p>Наші моменти назавжди ❤️</p>
  <button class="btn" onclick="show('home')">Назад</button>
</div><div id="messages" class="card hidden">
  <h3>💌 Повідомлення</h3>
  <p>Ти моя любов 💖</p>
  <button class="btn" onclick="openModal()">Відкрити</button>
  <button class="btn" onclick="show('home')">Назад</button>
</div><div id="surprise" class="card hidden">
  <h3>🎁 Сюрприз</h3>
  <button class="btn" onclick="burst()">Натисни</button>
  <button class="btn" onclick="show('home')">Назад</button>
</div></div><div id="modal" class="modal hidden" onclick="closeModal()">
  <div class="modal-content">
    <h2>Я тебе люблю, Надюшка ❤️</h2>
  </div>
</div><div id="explosion" class="hidden explosion">
  💥 LOVE EXPLOSION 💥
  <p>НАДЮШКА ТИ МОЯ ВСЕСВІТ ❤️</p>
</div><script>
let secret=0;

function show(id){
  document.querySelectorAll('.card').forEach(e=>e.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function openModal(){
  document.getElementById('modal').classList.remove('hidden');
}

function closeModal(){
  document.getElementById('modal').classList.add('hidden');
}

function burst(){
  for(let i=0;i<15;i++){
    const h=document.createElement('div');
    h.className='heart';
    h.innerHTML='💖';
    h.style.left=Math.random()*100+'vw';
    h.style.fontSize='20px';
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),2000);
  }
}

// secret 5 clicks
function secretClick(){
  secret++;
  if(secret>=5){
    document.getElementById('explosion').classList.remove('hidden');
  }
}

// hearts loop
setInterval(()=>{
  const h=document.createElement('div');
  h.className='heart';
  h.innerHTML='❤️';
  h.style.left=Math.random()*100+'vw';
  h.style.animationDuration=(3+Math.random()*3)+'s';
  document.getElementById('hearts').appendChild(h);
  setTimeout(()=>h.remove(),6000);
},200);
</script></body>
</html>
