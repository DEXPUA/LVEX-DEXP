<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ Для Надюшки ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#ff0844,#ff5e7e,#ff8fab,#ffc2d1);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.card{
    width:90%;
    max-width:650px;
    text-align:center;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.3);
    border-radius:30px;
    padding:40px;
    color:white;
    box-shadow:0 0 50px rgba(255,255,255,.2);
    animation:appear 2s ease;
}

@keyframes appear{
    from{
        opacity:0;
        transform:scale(.8);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

h1{
    font-size:52px;
    margin-bottom:20px;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.08);}
}

.message{
    font-size:22px;
    line-height:1.8;
}

button{
    margin-top:30px;
    padding:15px 35px;
    border:none;
    border-radius:50px;
    background:white;
    color:#ff2d55;
    font-size:20px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.1);
}

.heart{
    position:absolute;
    bottom:-50px;
    color:white;
    animation:float linear forwards;
    pointer-events:none;
}

@keyframes float{
    from{
        transform:translateY(0) rotate(0deg);
        opacity:1;
    }
    to{
        transform:translateY(-120vh) rotate(360deg);
        opacity:0;
    }
}

.glow{
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    filter:blur(60px);
}

.glow1{
    top:-100px;
    left:-100px;
}

.glow2{
    bottom:-100px;
    right:-100px;
}

#loveText{
    margin-top:25px;
    font-size:28px;
    color:#fff;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="glow glow1"></div>
<div class="glow glow2"></div>

<div class="card">

<h1>❤️ Надюшка ❤️</h1>

<div class="message">
Ти найпрекрасніша дівчина. 🌹<br><br>

Коли ти усміхаєшся — світ стає яскравішим.<br>
Коли ти поруч — серце б'ється швидше. ❤️<br><br>

Дякую, що ти є.
</div>

<button onclick="showLove()">
Натисни сюди ❤️
</button>

<div id="loveText"></div>

</div>

<script>

function showLove(){
    document.getElementById("loveText").innerHTML =
    "💖 Я тебе дуже сильно кохаю, Надюшка! 💖";
}

function createHeart(){
    let heart = document.createElement("div");

    heart.classList.add("heart");
    heart.innerHTML = ["❤️","💕","💖","💗","🌹"][Math.floor(Math.random()*5)];

    heart.style.left = Math.random()*100+"vw";
    heart.style.fontSize = (20+Math.random()*40)+"px";
    heart.style.animationDuration = (4+Math.random()*5)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },9000);
}

setInterval(createHeart,180);

</script>

</body>
</html>
